<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FinScore — Contas</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/style.css"><script>(function(){const s=localStorage.getItem('fs-theme')||'system';const d=window.matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.setAttribute('data-theme',s==='system'?(d?'dark':'light'):s)})();</script></head>
<body><div id="sidebar-root"></div><div id="navbar-root" class="lg:pl-[var(--fs-sidebar-w)]"></div><main class="lg:pl-[var(--fs-sidebar-w)] p-5 lg:p-8" style="max-width:1200px;margin:0 auto">
<section style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px"><div><p style="font-size:.78rem;color:var(--fs-text-muted);margin-bottom:5px">ESTRUTURA FINANCEIRA</p><h1 class="fs-display" style="font-size:1.65rem;font-weight:700">Contas</h1><p style="font-size:.88rem;color:var(--fs-text-muted);margin-top:4px">Organize onde seu dinheiro está e acompanhe o saldo de cada conta.</p></div><button class="fs-btn fs-btn-primary" id="btn-nova-conta"><i data-lucide="plus" class="w-4 h-4"></i> Nova conta</button></section>
<section class="grid grid-cols-1 sm:grid-cols-3 gap-4" style="margin-bottom:20px"><div class="fs-surface" style="padding:18px"><p style="font-size:.76rem;color:var(--fs-text-muted)">Saldo em caixa</p><strong id="fs-total-caixa" class="fs-mono" style="display:block;font-size:1.3rem;margin-top:8px">R$ 0,00</strong></div><div class="fs-surface" style="padding:18px"><p style="font-size:.76rem;color:var(--fs-text-muted)">Patrimônio líquido</p><strong id="fs-total-patrimonio" class="fs-mono" style="display:block;font-size:1.3rem;margin-top:8px">R$ 0,00</strong></div><div class="fs-surface" style="padding:18px"><p style="font-size:.76rem;color:var(--fs-text-muted)">Contas ativas</p><strong id="fs-total-contas" class="fs-mono" style="display:block;font-size:1.3rem;margin-top:8px">0</strong></div></section>
<section style="display:flex;flex-direction:column;gap:12px" id="fs-contas-lista"></section>
<section id="fs-contas-vazio" class="fs-surface" style="padding:42px 20px;text-align:center"><div class="fs-empty-icon" style="margin:0 auto"><i data-lucide="landmark" class="w-6 h-6"></i></div><p style="font-size:.88rem;font-weight:600;margin-top:12px">Você ainda não cadastrou uma conta</p><p style="font-size:.78rem;color:var(--fs-text-muted);max-width:390px;margin:6px auto 16px">A primeira conta será a base para calcular saldo disponível, patrimônio e fluxo financeiro.</p><button class="fs-btn fs-btn-secondary" id="btn-nova-conta-2"><i data-lucide="plus" class="w-4 h-4"></i> Cadastrar conta</button></section>
<p id="fs-contas-erro" hidden style="margin-top:12px;color:var(--fs-rose);font-size:.8rem"></p></main>
<script type="module">import{iniciarPagina}from'../js/app.js';import{inicializarContas}from'../js/modules/accounts.js';iniciarPagina('accounts',async()=>{if(window.lucide)window.lucide.createIcons();await inicializarContas();});</script></body></html>
