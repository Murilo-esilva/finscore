<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinScore — Perfil</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/style.css" />

  <script>
    (function () {
      const salvo = localStorage.getItem('fs-theme') || 'system';
      const escuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', salvo === 'system' ? (escuro ? 'dark' : 'light') : salvo);
    })();
  </script>
</head>
<body>
  <div id="sidebar-root"></div>
  <div id="navbar-root" class="lg:pl-[var(--fs-sidebar-w)]"></div>

  <main class="lg:pl-[var(--fs-sidebar-w)] p-5 lg:p-8" style="max-width:900px; margin:0 auto;">
    <div style="margin-bottom:24px;" class="fs-animate-in">
      <h1 class="fs-display" style="font-size:1.6rem; font-weight:700;">Perfil</h1>
      <p style="color:var(--fs-text-muted); font-size:0.9rem; margin-top:4px;">Seus dados de conta.</p>
    </div>

    <div class="fs-surface fs-animate-in" style="padding:28px;">
      <div id="fs-profile-skeleton"></div>

      <div id="fs-profile-conteudo" style="display:none;">
        <div style="display:flex; align-items:center; gap:16px; margin-bottom:24px;">
          <img id="fs-profile-foto" src="" alt="" style="width:64px;height:64px;border-radius:50%;object-fit:cover; display:none;" />
          <div id="fs-profile-iniciais" style="width:64px;height:64px;border-radius:50%;background:var(--fs-gradient);color:#fff;display:none;align-items:center;justify-content:center;font-weight:700;font-size:1.4rem;"></div>
          <div>
            <p id="fs-profile-nome" class="fs-display" style="font-size:1.2rem; font-weight:700;">—</p>
            <p id="fs-profile-email" style="font-size:0.85rem; color:var(--fs-text-muted);">—</p>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <p style="font-size:0.75rem; color:var(--fs-text-muted); margin-bottom:4px;">Salário</p>
            <p class="fs-mono" style="font-weight:600;" id="fs-profile-salario">Não informado</p>
          </div>
          <div>
            <p style="font-size:0.75rem; color:var(--fs-text-muted); margin-bottom:4px;">Meta mensal</p>
            <p class="fs-mono" style="font-weight:600;" id="fs-profile-meta">Não informado</p>
          </div>
          <div>
            <p style="font-size:0.75rem; color:var(--fs-text-muted); margin-bottom:4px;">Objetivo de economia</p>
            <p class="fs-mono" style="font-weight:600;" id="fs-profile-objetivo">Não informado</p>
          </div>
          <div>
            <p style="font-size:0.75rem; color:var(--fs-text-muted); margin-bottom:4px;">Conta criada em</p>
            <p class="fs-mono" style="font-weight:600;" id="fs-profile-criado">—</p>
          </div>
        </div>

        <button class="fs-btn fs-btn-secondary" style="margin-top:24px;" disabled title="Edição chega na etapa de Configurações">
          <i data-lucide="pencil" class="w-4 h-4"></i> Editar perfil
        </button>
      </div>
    </div>
  </main>

  <script type="module">
    import { iniciarPagina } from '../js/app.js';
    import { getDocumento } from '../services/firestore.js';
    import { formatarMoeda, formatarData } from '../js/modules/utils.js';
    import { skeletonLinhas } from '../components/loader.js';

    document.getElementById('fs-profile-skeleton').innerHTML = skeletonLinhas(4, 44);

    iniciarPagina('profile', async (user) => {
      const dados = await getDocumento('users', user.uid);

      document.getElementById('fs-profile-nome').textContent = user.displayName || dados?.nome || 'Sem nome';
      document.getElementById('fs-profile-email').textContent = user.email || '';

      if (user.photoURL) {
        const foto = document.getElementById('fs-profile-foto');
        foto.src = user.photoURL;
        foto.style.display = 'block';
      } else {
        const iniciais = document.getElementById('fs-profile-iniciais');
        iniciais.textContent = (user.displayName || user.email || '?').charAt(0).toUpperCase();
        iniciais.style.display = 'flex';
      }

      if (dados?.salario) document.getElementById('fs-profile-salario').textContent = formatarMoeda(dados.salario);
      if (dados?.metaMensal) document.getElementById('fs-profile-meta').textContent = formatarMoeda(dados.metaMensal);
      if (dados?.objetivoEconomia) document.getElementById('fs-profile-objetivo').textContent = formatarMoeda(dados.objetivoEconomia);
      if (dados?.createdAt) document.getElementById('fs-profile-criado').textContent = formatarData(dados.createdAt);

      document.getElementById('fs-profile-skeleton').style.display = 'none';
      document.getElementById('fs-profile-conteudo').style.display = 'block';

      if (window.lucide) window.lucide.createIcons();
    });
  </script>
</body>
</html>
