<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinScore — Relatórios</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/style.css" />

  <script>
    (function () {
      const salvo = localStorage.getItem('fs-theme') || 'system';
      const escuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', salvo === 'system' ? (escuro ? 'dark' : 'light') : salvo);
    })();
  </script>
</head>
<body>
  <div id="sidebar-root"></div>
  <div id="navbar-root" class="lg:pl-[var(--fs-sidebar-w)]"></div>

  <main class="lg:pl-[var(--fs-sidebar-w)] p-5 lg:p-8" style="max-width:1400px; margin:0 auto;">
    <div style="margin-bottom:24px;" class="fs-animate-in">
      <h1 class="fs-display" style="font-size:1.6rem; font-weight:700;">Relatórios</h1>
      <p style="color:var(--fs-text-muted); font-size:0.9rem; margin-top:4px;">
        Visões mensais, semanais, anuais e por categoria, forma de pagamento e localização.
      </p>
    </div>

    <div class="fs-surface fs-animate-in" style="padding:24px;">
      <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:48px 16px; gap:12px;">
        <div class="fs-empty-icon"><i data-lucide="bar-chart-3" class="w-6 h-6"></i></div>
        <p style="font-weight:600;">Os gráficos chegam na etapa "Gráficos" e "Relatórios"</p>
        <p style="font-size:0.85rem; color:var(--fs-text-muted); text-align:center; max-width:380px;">
          Esta página está pronta para receber Chart.js (pizza, linha, barra, área) e os filtros
          de período, categoria e localização.
        </p>
      </div>
    </div>
  </main>

  <script type="module">
    import { iniciarPagina } from '../js/app.js';

    iniciarPagina('reports', () => {
      if (window.lucide) window.lucide.createIcons();
    });
  </script>
</body>
</html>
